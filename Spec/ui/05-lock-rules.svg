<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" style="font-family: system-ui, 'Segoe UI', Arial, sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D8BFD"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8505B"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text x="40" y="46" font-size="24" font-weight="800" fill="#2B2D42">How a dropped piece locks: to the shape’s corners or to its neighbours</text>
<text x="40" y="72" font-size="15" fill="#7E8299">Mountain puzzle. Dots are anchor points (drawn here only to explain; the player never sees them).</text>
<text x="40" y="92" font-size="15" fill="#7E8299">A piece locks where one of its corners sits on an anchor, fully inside, with no overlap. Otherwise it goes home.</text>
<rect x="40" y="116" width="340" height="400" rx="22" fill="#FBF7EE" stroke="#E6E1D6"/>
<text x="60" y="150" font-size="18" font-weight="800" fill="#2B2D42">1 · Outline corners</text>
<polygon points="66.0,330.0 210.0,330.0 138.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="210.0,330.0 210.0,186.0 138.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="210.0,186.0 210.0,258.0 246.0,222.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="282.0,258.0 246.0,222.0 210.0,258.0 246.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="210.0,258.0 210.0,330.0 282.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="282.0,258.0 246.0,294.0 318.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="354.0,330.0 318.0,294.0 246.0,294.0 282.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="66.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="210.0" cy="186.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="354.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<text x="60" y="378" font-size="14.5" fill="#2B2D42">White dots: where the outline turns.</text>
<text x="60" y="399" font-size="14.5" fill="#2B2D42">The mountain has only three.</text>
<text x="60" y="420" font-size="14.5" fill="#2B2D42">Points along a straight side</text>
<text x="60" y="441" font-size="14.5" fill="#2B2D42">are not anchors.</text>
<rect x="400" y="116" width="340" height="400" rx="22" fill="#FBF7EE" stroke="#E6E1D6"/>
<text x="420" y="150" font-size="18" font-weight="800" fill="#2B2D42">2 · Tie to a corner</text>
<polygon points="426.0,330.0 570.0,330.0 498.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="570.0,330.0 570.0,186.0 498.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="570.0,186.0 570.0,258.0 606.0,222.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="642.0,258.0 606.0,222.0 570.0,258.0 606.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="570.0,258.0 570.0,330.0 642.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="642.0,258.0 606.0,294.0 678.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="714.0,330.0 678.0,294.0 606.0,294.0 642.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="438.6,319.2 582.6,319.2 510.6,247.2" fill="#E8505B" opacity="0.45" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="426.0,330.0 570.0,330.0 498.0,258.0" fill="#E8505B" stroke="#FFFFFF" stroke-width="2.5"/>
<circle cx="426.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="570.0" cy="186.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="714.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="570.0" cy="330.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="498.0" cy="258.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<line x1="442.2" y1="315.6" x2="428.88" y2="327.48" stroke="#3D8BFD" stroke-width="3" marker-end="url(#ar)"/>
<text x="420" y="378" font-size="14.5" fill="#2B2D42">Dropped a little off, the big triangle</text>
<text x="420" y="399" font-size="14.5" fill="#2B2D42">slides so its corner sits on the</text>
<text x="420" y="420" font-size="14.5" fill="#2B2D42">outline corner (0, 4) and clicks.</text>
<text x="420" y="441" font-size="14.5" fill="#2B2D42">Its corners become new anchors</text>
<text x="420" y="462" font-size="14.5" fill="#2B2D42">(yellow).</text>
<rect x="760" y="116" width="340" height="400" rx="22" fill="#FBF7EE" stroke="#E6E1D6"/>
<text x="780" y="150" font-size="18" font-weight="800" fill="#2B2D42">3 · Nothing to hold on to</text>
<polygon points="786.0,330.0 930.0,330.0 858.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="930.0,330.0 930.0,186.0 858.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="930.0,186.0 930.0,258.0 966.0,222.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1002.0,258.0 966.0,222.0 930.0,258.0 966.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="930.0,258.0 930.0,330.0 1002.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1002.0,258.0 966.0,294.0 1038.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1074.0,330.0 1038.0,294.0 966.0,294.0 1002.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="786.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="930.0" cy="186.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1074.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<polygon points="1002.0,258.0 966.0,222.0 930.0,258.0 966.0,294.0" fill="#FFD23F" opacity="0.6" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M966,272 C966,303 980,320 992,332" fill="none" stroke="#E8505B" stroke-width="3" marker-end="url(#arr)"/>
<text x="980" y="354" font-size="14" font-weight="700" fill="#E8505B">back to tray</text>
<text x="780" y="378" font-size="14.5" fill="#2B2D42">The square dropped first, in the</text>
<text x="780" y="399" font-size="14.5" fill="#2B2D42">middle: none of its corners is near</text>
<text x="780" y="420" font-size="14.5" fill="#2B2D42">an anchor, so it goes home.</text>
<text x="780" y="441" font-size="14.5" fill="#2B2D42">Not supported on purpose: puzzles</text>
<text x="780" y="462" font-size="14.5" fill="#2B2D42">are built edge-first (rule V11).</text>
<rect x="1120" y="116" width="340" height="400" rx="22" fill="#FBF7EE" stroke="#E6E1D6"/>
<text x="1140" y="150" font-size="18" font-weight="800" fill="#2B2D42">4 · Grow from neighbours</text>
<polygon points="1146.0,330.0 1290.0,330.0 1218.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1290.0,330.0 1290.0,186.0 1218.0,258.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1290.0,186.0 1290.0,258.0 1326.0,222.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1362.0,258.0 1326.0,222.0 1290.0,258.0 1326.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1290.0,258.0 1290.0,330.0 1362.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1362.0,258.0 1326.0,294.0 1398.0,294.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1434.0,330.0 1398.0,294.0 1326.0,294.0 1362.0,330.0" fill="#4A4E69" stroke="#4A4E69" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1146.0,330.0 1290.0,330.0 1218.0,258.0" fill="#E8505B" stroke="#FFFFFF" stroke-width="2.5"/>
<polygon points="1290.0,330.0 1290.0,186.0 1218.0,258.0" fill="#3D8BFD" stroke="#FFFFFF" stroke-width="2.5"/>
<polygon points="1290.0,186.0 1290.0,258.0 1326.0,222.0" fill="#2DBE7E" stroke="#FFFFFF" stroke-width="2.5"/>
<polygon points="1362.0,258.0 1326.0,222.0 1290.0,258.0 1326.0,294.0" fill="#FFD23F" stroke="#FFFFFF" stroke-width="2.5"/>
<circle cx="1146.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1290.0" cy="186.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1434.0" cy="330.0" r="5.5" fill="#FFFFFF" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1290.0" cy="330.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1218.0" cy="258.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1290.0" cy="330.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1218.0" cy="258.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1290.0" cy="258.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<circle cx="1326.0" cy="222.0" r="5.5" fill="#FFD23F" stroke="#2B2D42" stroke-width="1.3"/>
<text x="1140" y="378" font-size="14.5" fill="#2B2D42">With the big triangles and a small</text>
<text x="1140" y="399" font-size="14.5" fill="#2B2D42">one placed, their corners give the</text>
<text x="1140" y="420" font-size="14.5" fill="#2B2D42">square something to hold, and now</text>
<text x="1140" y="441" font-size="14.5" fill="#2B2D42">it locks. Any arrangement that fills</text>
<text x="1140" y="462" font-size="14.5" fill="#2B2D42">the shape exactly wins.</text>
</svg>