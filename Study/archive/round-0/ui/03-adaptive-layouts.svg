<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Nunito, Segoe UI, Arial, sans-serif"><defs><filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/></filter><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="1500" height="900" fill="#FFFFFF"/><text x="40" y="46" font-size="22" font-weight="800" fill="#2B2D42">Adaptive layout · one rule decides the tray</text><text x="40" y="68" font-size="14" fill="#8A8FA8">Phones (narrow): 2 tray rows, big pieces on top. Tablets (wide): 1 tray row. The tray is always at the bottom; the board takes what is left.</text>
