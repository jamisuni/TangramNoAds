<text x="860" y="550.0" font-size="13" fill="#8A8FA8">1280×800 dp · tray 1 row · corner buttons</text>
<text x="860" y="610" font-size="15" font-weight="700" fill="#2B2D42">Layout rules (Android window size classes):</text>
<text x="860" y="633" font-size="14" font-weight="400" fill="#2B2D42">• Compact width (< 600 dp): phone → portrait only, top bar, tray 2 rows</text>
<text x="860" y="656" font-size="14" font-weight="400" fill="#2B2D42">   row 1 = big pieces (LT, LT, MT), row 2 = small (SQ, PG, ST, ST)</text>
<text x="860" y="679" font-size="14" font-weight="400" fill="#2B2D42">• Medium / Expanded (≥ 600 dp): tablet → both orientations, tray 1 row,</text>
<text x="860" y="702" font-size="14" font-weight="400" fill="#2B2D42">   Home / Hint in the corners</text>
<text x="860" y="725" font-size="14" font-weight="400" fill="#2B2D42">• Cells are sized per piece so ALL miniatures share one scale, the largest</text>
<text x="860" y="748" font-size="14" font-weight="400" fill="#2B2D42">   that fits the width; one tray row is at most 16 % of the window height</text>
<text x="860" y="771" font-size="14" font-weight="400" fill="#2B2D42">• Board = the largest box left; puzzle fitted with 10 % padding</text>
<text x="860" y="794" font-size="14" font-weight="400" fill="#2B2D42">• Phone landscape is NOT supported in v1 (board would be too small)</text></svg>